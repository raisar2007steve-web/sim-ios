name: iOS Simulator Live

# Manual only: this boots a real macOS runner, a simulator and a public tunnel,
# so it must never run on ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name (blank = newest available iPhone)'
        required: false
        default: ''
      duration_minutes:
        description: 'Session length: 0 = keep it live until the run is cancelled, or 1-240 minutes'
        required: false
        default: '0'
      frame_rate:
        description: 'Frame-rate cap (1-90). The loop runs as fast as the device allows; this only limits it.'
        required: false
        default: '30'
      min_fps:
        description: 'Hard minimum measured fps (0 = no gate). The run fails instead of publishing a slower session.'
        required: false
        default: '5'
      run_tests:
        description: 'Run unit/UI tests when the scheme supports them'
        required: false
        type: boolean
        default: false
      install_input_driver:
        description: 'Install touch/keyboard injection tooling'
        required: false
        type: boolean
        default: true
      persist_state:
        description: 'Save the simulator device state and resume it next run'
        required: false
        type: boolean
        default: true

permissions:
  # write is only used to push the session heartbeat log to session-logs/.
  contents: write

concurrency:
  group: ios-simulator-live
  cancel-in-progress: false

jobs:
  live:
    name: Live iOS Simulator session
    # Set the RUNNER_LABEL repository variable (for example `self-hosted, macOS`)
    # to run the same session on a Mac you control. That is what 60/90 fps needs:
    # a hosted runner cannot be granted macOS screen-capture permission.
    runs-on: ${{ vars.RUNNER_LABEL || 'macos-latest' }}
    timeout-minutes: 350
    env:
      SESSION_DIR: ${{ github.workspace }}/.session
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
      PORT: '8080'
      # 0 = native device resolution: no per-frame `sips` downscale, which is
      # the single biggest cost in the capture loop. Set a width (e.g. 750) to
      # trade sharpness for bandwidth.
      FRAME_WIDTH: '0'
      SIM_STATE_DIR: ${{ github.workspace }}/.sim-state

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs and create session
        env:
          INPUT_DURATION: ${{ inputs.duration_minutes }}
          INPUT_FPS: ${{ inputs.frame_rate }}
          INPUT_MIN_FPS: ${{ inputs.min_fps }}
          INPUT_DEVICE: ${{ inputs.device }}
        run: bash scripts/ios-simulator/init-session.sh

      - name: Detect macOS, Xcode and simulator runtimes
        run: bash scripts/ios-simulator/detect-environment.sh

      - name: Restore saved simulator state
        if: inputs.persist_state
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sim-state
          key: ios-sim-state-${{ github.run_id }}
          restore-keys: |
            ios-sim-state-

      - name: Apply saved simulator state
        env:
          INPUT_PERSIST_STATE: ${{ inputs.persist_state }}
        run: bash scripts/ios-simulator/restore-state.sh

      - name: Select and boot iPhone simulator
        run: bash scripts/ios-simulator/boot-simulator.sh

      - name: Build, install and launch application
        env:
          INPUT_RUN_TESTS: ${{ inputs.run_tests }}
        run: bash scripts/ios-simulator/build-and-launch.sh

      - name: Install input driver tooling
        env:
          INPUT_INSTALL_DRIVER: ${{ inputs.install_input_driver }}
        run: bash scripts/ios-simulator/setup-input-driver.sh

      - name: Start streaming server
        run: bash scripts/ios-simulator/start-viewer.sh

      - name: Start HTTPS tunnel
        env:
          CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
          TUNNEL_HOSTNAME: ${{ secrets.TUNNEL_HOSTNAME || vars.TUNNEL_HOSTNAME }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_STATIC_DOMAIN: ${{ vars.NGROK_STATIC_DOMAIN || secrets.NGROK_STATIC_DOMAIN }}
        run: bash scripts/ios-simulator/start-tunnel.sh

      - name: Verify endpoint, authentication, stream and input
        run: bash scripts/ios-simulator/verify-session.sh

      - name: Publish session access URL
        run: bash scripts/ios-simulator/publish-session.sh

      - name: Upload access URL (available during the session)
        uses: actions/upload-artifact@v4
        with:
          name: session-access
          path: artifacts/session-access.txt
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      - name: Keep session alive until cancelled (heartbeat pushed to session-logs/)
        env:
          HEARTBEAT_PUSH_MINUTES: '5'
        run: bash scripts/ios-simulator/keepalive.sh

      - name: Save simulator state
        if: always()
        env:
          INPUT_PERSIST_STATE: ${{ inputs.persist_state }}
        run: bash scripts/ios-simulator/save-state.sh

      - name: Persist simulator state for the next run
        if: always() && inputs.persist_state
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sim-state
          key: ios-sim-state-${{ github.run_id }}

      - name: Write final summary
        if: always()
        run: bash scripts/ios-simulator/write-summary.sh

      - name: Cleanup simulator, services and credentials
        if: always()
        run: bash scripts/ios-simulator/cleanup.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: |
            artifacts/
            .session/capability.json
            .session/session.json
            .session/stream-check.json
            .session/closed.json
          if-no-files-found: warn
          retention-days: 7
