<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Starly Industries — Remote iOS Simulator</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
</div>

<header class="topbar">
  <div class="brand glass-pill">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 3.5l2.1 5.6 5.9.4-4.5 3.8 1.4 5.7L12 15.9l-4.9 3.1 1.4-5.7L4 9.5l5.9-.4L12 3.5z"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>Starly Industries</h1>
      <p>Remote iOS Simulator · <span id="project-name">sim-ios</span></p>
    </div>
  </div>

  <div class="status glass-pill" id="status" data-state="connecting" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div class="workspace">
  <nav class="rail glass" aria-label="Simulator tools">
    <button type="button" class="tool" id="btn-home" title="Home button" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 5l8 6.5V19H4z"/></svg>
      <span>Home</span>
    </button>
    <button type="button" class="tool" id="btn-rotate" title="Rotate" aria-label="Rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
      <span>Rotate</span>
    </button>
    <button type="button" class="tool" id="btn-keyboard" title="Keyboard input" aria-label="Keyboard" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M10.5 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg>
      <span>Keys</span>
    </button>
    <button type="button" class="tool" id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg>
      <span>Full</span>
    </button>
    <button type="button" class="tool" id="btn-reconnect" title="Reconnect" aria-label="Reconnect">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></svg>
      <span>Retry</span>
    </button>
    <button type="button" class="tool ghost" id="btn-session" title="Session information" aria-label="Session information">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8h.01"/></svg>
      <span>Info</span>
    </button>
    <p class="rail-hint" id="hint">Tap · drag</p>
  </nav>

  <main class="stage" id="stage">
    <div class="device glass-frame" id="device">
      <canvas id="screen" width="1179" height="2556" aria-label="Live iOS Simulator screen" tabindex="0"></canvas>
      <div class="device-notch" aria-hidden="true"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card glass">
          <h2 id="overlay-title">Connecting to simulator</h2>
          <p id="overlay-body">Waiting for the first frame from the macOS runner.</p>
          <button type="button" class="tool wide" id="overlay-retry">Retry</button>
        </div>
      </div>
      <div class="stream-stat glass-pill" id="stream-stat" hidden aria-hidden="true"></div>
      <div class="mock-badge glass-pill" id="mock-badge" hidden>DEMO PREVIEW · NO SIMULATOR ATTACHED</div>
    </div>
  </main>
</div>

<div class="keyboard-tray glass" id="keyboard-tray" hidden>
  <label for="kb-input">Keyboard → simulator</label>
  <input id="kb-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here; Return sends a return key">
  <button type="button" class="tool wide" id="btn-send-return">Return</button>
</div>

<dialog id="session-dialog" class="glass">
  <h2>Session information</h2>
  <dl id="session-list"></dl>
  <p class="dialog-note" id="session-note"></p>
  <form method="dialog"><button class="tool wide">Close</button></form>
</dialog>

<div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Touch cursor: drawn over the stream so you can see exactly where a tap or
     drag will land on the simulated device. -->
<div class="cursor" id="cursor" hidden aria-hidden="true">
  <span class="cursor-ring"></span>
  <span class="cursor-dot"></span>
</div>

<script src="app.js"></script>
</body>
</html>
